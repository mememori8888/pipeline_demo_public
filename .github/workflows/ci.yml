name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  fastapi-ci:
    name: FastAPI CI
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: "dummy-ci-key"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      APP_API_KEY: "dummy-ci-app-key"
      SQLITE_DB_PATH: "/tmp/shared_tenant_store.db"
      CHROMA_DB_DIR: "/tmp/chroma_vector_store"
      GOOGLE_DRIVE_INPUT_FOLDER_ID: ""
      GOOGLE_DRIVE_OUTPUT_FOLDER_ID: ""
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app

      - name: Import FastAPI app
        run: python -c "from app.main import app; print(app.title); print(len(app.routes))"

      - name: Start API and check health
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          API_PID=$!
          trap "kill $API_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Build Docker image
        run: docker build -t pipeline-demo:ci .
